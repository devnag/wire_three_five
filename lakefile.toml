name = "wire_three_five"
version = "1.0.0"
defaultTargets = ["WireThreeFive"]

[leanOptions]
maxHeartbeats = 250000
maxRecDepth = 120000
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "WireThreeFive"
roots = ["MainTheorem_Wire_3_5"]
globs = ["MainTheorem_Wire_3_5", "Statement", "Statement_Wire_3_5", "StatementChecks.+", "Proof.+", "Bindings.+"]

# For comparator only (README, "Optional extra checks"); `make` does not build them.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
